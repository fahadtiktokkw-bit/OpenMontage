name: Almusaileem free video
on:
  workflow_dispatch:
    inputs:
      voice:
        description: 'الصوت: elevenlabs رصيد حسابك، uploaded تسجيلك، edge، silent'
        required: true
        default: silent
        type: choice
        options: [elevenlabs, uploaded, edge, silent]
      elevenlabs_voice_id:
        description: 'Voice ID لصوت الرجل العربي (اختياري إذا مضبوط بمتغيرات المستودع)'
        type: string
      topic:
        description: 'موضوع الفيديو (اتركه فارغاً للمثال الحالي)'
        type: string
      script:
        description: 'نص التعليق الصوتي القصير'
        type: string
      image_urls:
        description: '3 روابط صور HTTPS، افصل بينها بعلامة |'
        type: string
      titles:
        description: '3 عناوين للمشاهد، افصل بينها بعلامة |'
        type: string
      details:
        description: '3 نصوص قصيرة للمشاهد، افصل بينها بعلامة |'
        type: string
      audio_url:
        description: 'رابط تسجيلك الصوتي: MP3 أو WAV أو M4A'
        type: string
      illustrative:
        description: 'الصور تصاميم توضيحية وليست صور تنفيذ'
        type: boolean
        default: true
      gallery:
        description: 'إضافة الفيديو تلقائياً لمعرض الموقع'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: almusaileem-video
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          git clone https://github.com/harry0703/MoneyPrinterTurbo.git almusaileem-video/engine
          git -C almusaileem-video/engine checkout bd6939b61292d2acf435e0c8bd442470843a2781
          python -m pip install -r almusaileem-video/engine/requirements.txt
          python -m pip check
      - name: Prepare your request
        env:
          REQUEST_TOPIC: ${{ inputs.topic }}
          REQUEST_SCRIPT: ${{ inputs.script }}
          REQUEST_IMAGES: ${{ inputs.image_urls }}
          REQUEST_TITLES: ${{ inputs.titles }}
          REQUEST_DETAILS: ${{ inputs.details }}
          REQUEST_AUDIO: ${{ inputs.audio_url }}
          REQUEST_ILLUSTRATIVE: ${{ inputs.illustrative }}
        run: python almusaileem-video/prepare_request.py
      - name: Produce video
        env:
          VOICE_MODE: ${{ inputs.audio_url != '' && 'uploaded' || inputs.voice }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ inputs.elevenlabs_voice_id || vars.ELEVENLABS_VOICE_ID }}
        run: python almusaileem-video/render.py
      - name: Save permanent video and update gallery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUEST_GALLERY: ${{ inputs.gallery }}
        run: python almusaileem-video/publish.py
      - name: Download video and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: almusaileem-video-${{ github.run_number }}
          path: almusaileem-video/output/
          if-no-files-found: warn
          retention-days: 1
