name: Almusaileem ElevenLabs connection check
on:
  push:
    paths: ['.github/workflows/almusaileem-elevenlabs-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify connection without generation
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'almusaileem-video')
          from elevenlabs_voice import request, budget
          key=os.environ.get('ELEVENLABS_API_KEY','')
          voice=os.environ.get('ELEVENLABS_VOICE_ID','')
          if not key or not voice:
              raise SystemExit('Connection setup is incomplete: missing secret or voice ID')
          subscription=request('/v1/user/subscription',key)
          metadata=request('/v1/voices/'+voice,key)
          voice_ok=(metadata.get('labels') or {}).get('gender','').lower()=='male'
          ready=True
          try:
              budget(subscription,'Connection check')
          except RuntimeError:
              ready=False
          result={'connected':True,'selected_male_voice_available':voice_ok,
                  'generation_policy_ready':ready and voice_ok,
                  'generation_requests':0,'purchases':0}
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## ElevenLabs connection\n\n')
              f.write('Connection: confirmed\n\n')
              f.write('Selected male voice: '+('available' if voice_ok else 'requires attention')+'\n\n')
              f.write('Generation policy: '+('ready' if ready and voice_ok else 'blocked; review account license, overage settings and included credits')+'\n\n')
              f.write('No speech generated. No credit purchases. Account balances and keys are not included in this report.\n')
          PY
