name: Almusaileem Vertical Video

on:
  workflow_dispatch:
  push:
    branches:
      - cloud-setup
    paths:
      - ".github/workflows/openmontage-cloud.yml"

jobs:
  render-almusaileem:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create Almusaileem 9x16 reel
        run: |
          mkdir -p projects/almusaileem/output
          ffmpeg -y -i projects/VID-20260921-WA0004.mp4 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,eq=contrast=1.04:saturation=1.03:brightness=0.01,fade=t=in:st=0:d=0.35,fade=t=out:st=18.4:d=0.6" \
            -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -movflags +faststart \
            projects/almusaileem/output/almusaileem-microcement-reel.mp4

      - name: Verify output
        run: |
          test -f projects/almusaileem/output/almusaileem-microcement-reel.mp4
          ffprobe -v error -show_entries stream=width,height -show_entries format=duration,size -of default=noprint_wrappers=1 projects/almusaileem/output/almusaileem-microcement-reel.mp4

      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: almusaileem-microcement-reel
          path: projects/almusaileem/output/almusaileem-microcement-reel.mp4
          if-no-files-found: error
