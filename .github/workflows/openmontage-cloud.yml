name: OpenMontage Cloud Render

on:
  workflow_dispatch:
  push:
    branches:
      - cloud-setup
    paths:
      - ".github/workflows/openmontage-cloud.yml"

jobs:
  render-openmontage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg and Make
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg make

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install piper-tts

      - name: Install Remotion dependencies
        working-directory: remotion-composer
        run: npm install

      - name: Prepare environment
        run: cp -n .env.example .env || true

      - name: Verify OpenMontage
        run: |
          python --version
          node --version
          ffmpeg -version | head -1
          python -c "from tools.tool_registry import registry; registry.discover(); print('OpenMontage registry OK')"

      - name: Render zero-key MP4
        run: python render_demo.py focusflow-pitch

      - name: Verify rendered video
        run: |
          test -f projects/demos/renders/focusflow-pitch.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 projects/demos/renders/focusflow-pitch.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: openmontage-first-video
          path: projects/demos/renders/focusflow-pitch.mp4
          if-no-files-found: error
